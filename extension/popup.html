<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="vendor/layui/css/layui.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="layui-overrides.css">
  </head>
  <body>
    <main class="layui-form" lay-filter="free-ig-export-popup">
      <header class="popup-header"><div class="brand">free-ig-export</div><div class="status-row"><p id="pageStatus" data-i18n="popup.checking">Checking current page…</p><button id="clearData" class="layui-btn layui-btn-primary clear" hidden data-i18n="popup.clear">Clear</button></div></header>
      <section class="controls" data-i18n-aria-label="popup.collectionSettings"><label class="field"><span data-i18n="popup.collect">Collect</span><select id="listType"><option value="followers" data-i18n="list.followers">Followers</option><option value="following" data-i18n="list.following">Following</option></select></label><label class="field"><span data-i18n="popup.limit">Limit</span><input id="limit" class="layui-input" type="number" min="1" value="300"></label><label class="field"><span data-i18n="popup.interval">Interval (ms)</span><input id="delay" class="layui-input" type="number" min="1000" step="500" value="5000"></label></section>
      <section class="mode-group" data-i18n-aria-label="popup.collectionMode"><label class="mode-option"><input type="radio" name="mode" value="api" data-i18n-title="popup.directApi" checked><span class="mode-description" data-i18n="popup.apiDescription">Recommended · fastest local pagination</span></label><label class="mode-option"><input type="radio" name="mode" value="browser" data-i18n-title="popup.browserAssisted"><span class="mode-description" data-i18n="popup.browserDescription">Use this if Direct API is restricted</span></label></section>
      <label class="field"><span data-i18n="language.label">Language</span><select id="language"><option value="auto" data-i18n="language.auto">Automatic (browser language)</option><option value="en" data-i18n="language.en">English</option><option value="zh-cn" data-i18n="language.zh-cn">Simplified Chinese</option><option value="zh-tw" data-i18n="language.zh-tw">Traditional Chinese</option></select></label>
      <button id="start" class="layui-btn layui-btn-fluid" data-i18n="action.start">Start collection</button><div id="taskActions" class="actions" hidden><button id="pause" class="layui-btn layui-btn-primary" data-i18n="action.pause">Pause</button><button id="stop" class="layui-btn danger" data-i18n="action.stop">Stop</button></div><div class="exports"><button id="csv" class="layui-btn layui-btn-primary">CSV</button><button id="json" class="layui-btn layui-btn-primary">JSON</button><button id="excel" class="layui-btn layui-btn-primary">Excel</button></div><button id="pricing" class="layui-btn layui-btn-primary layui-btn-fluid link" data-i18n="action.pricing">Pricing &amp; plans</button><p id="hint" class="hint"></p>
    </main>
    <script src="vendor/layui/layui.js"></script><script src="i18n.js"></script><script src="popup.js"></script>
  </body>
</html>
